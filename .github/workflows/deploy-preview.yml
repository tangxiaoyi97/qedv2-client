name: Deploy preview

# Builds @qed2/web for the PREVIEW channel and ships it to the self-hosted
# preview box. Deliberately NOT GitHub Pages: preview and production must not
# share an origin, because one origin means one IndexedDB and one service
# worker registration — a preview build with a changed archive shape would
# sync corruption into real accounts carrying a valid checksum, and a stale
# root SW would serve the wrong app entirely. Both have already happened once.

on:
  push:
    branches: [preview]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: preview
  # Uploads are staged and the live symlink changes only after rsync succeeds,
  # so a newer preview can safely supersede stale queued/building work.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: preview
      url: https://qed-pv.barcarolle.studio
    steps:
      - name: Validate preview deployment configuration
        shell: bash
        env:
          PREVIEW_DEPLOY_KEY: ${{ secrets.PREVIEW_DEPLOY_KEY }}
          PREVIEW_KNOWN_HOSTS: ${{ secrets.PREVIEW_KNOWN_HOSTS }}
          PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
          PREVIEW_SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
        run: |
          set -euo pipefail
          MISSING=()
          for NAME in PREVIEW_DEPLOY_KEY PREVIEW_KNOWN_HOSTS PREVIEW_SSH_HOST PREVIEW_SSH_USER; do
            if [[ -z "${!NAME}" ]]; then MISSING+=("$NAME"); fi
          done
          if (( ${#MISSING[@]} > 0 )); then
            echo "Missing preview environment secrets: ${MISSING[*]}" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (workspace)
        run: pnpm install --frozen-lockfile

      # Preview is not a bypass lane. A red suite still stops the deploy.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build (preview channel)
        env:
          QED2_CHANNEL: preview
          QED2_DEFAULT_CORE: https://qedcore-pv.barcarolle.studio
          QED2_DEFAULT_SERVER: https://qedsync-pv.barcarolle.studio
        run: pnpm --filter @qed2/web build

      # Proves the artifact belongs to the channel it claims — a source-level
      # convention does not survive a mis-push, a build artifact assertion does.
      - name: Assert channel
        working-directory: packages/web
        run: node scripts/assert-channel.mjs preview

      - name: Install SSH key
        env:
          DEPLOY_KEY: ${{ secrets.PREVIEW_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.PREVIEW_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Atomic: upload into releases/<sha>/, then swap a symlink.
      #
      # Not optional for a PWA. rsyncing into the live directory leaves a
      # window where index.html is new and assets/*.js are not — and the
      # service worker precaches that broken state, so the app stays broken on
      # every device that loaded during it, long after the server recovered.
      - name: Upload release
        env:
          HOST: ${{ secrets.PREVIEW_SSH_HOST }}
          USER: ${{ secrets.PREVIEW_SSH_USER }}
          ROOT: /srv/qed2-preview
        run: |
          set -euo pipefail
          REL="$ROOT/releases/${GITHUB_SHA::7}"
          ssh "$USER@$HOST" "mkdir -p '$REL'"
          rsync -az --delete packages/web/dist/ "$USER@$HOST:$REL/"
          ssh "$USER@$HOST" "ln -sfn '$REL' '$ROOT/current.tmp' && mv -Tf '$ROOT/current.tmp' '$ROOT/current'"
          # Keep the last five so a rollback is one symlink swap.
          ssh "$USER@$HOST" "cd '$ROOT/releases' && ls -1dt */ | tail -n +6 | xargs -r rm -rf"
          echo "deployed ${GITHUB_SHA::7} to qed-pv.barcarolle.studio"
