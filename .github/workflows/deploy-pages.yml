name: Deploy web to GitHub Pages

# Builds @qed2/web (static) and publishes packages/web/dist to GitHub Pages.
# The client is a pure static SPA — login/content live on the remote
# core/server services (configurable in the app's settings).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege token that the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  # A Pages deployment is atomic. A newer main commit must supersede an old
  # queued/building run instead of waiting behind stale work indefinitely.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (workspace)
        run: pnpm install --frozen-lockfile

      # Gate the deploy. Every push to main goes straight to the live domain,
      # so a red suite must stop the publish rather than reach students.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # The changelog needs nothing from CI: which notes ship is decided by
      # CHANGELOG.md, which the release commit already carries.
      - name: Build web
        run: pnpm --filter @qed2/web build

      - name: Assert stable channel artifact
        working-directory: packages/web
        run: node scripts/assert-channel.mjs stable

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
