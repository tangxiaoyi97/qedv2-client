name: Deploy web to GitHub Pages

# Builds @qed2/web (static) and publishes packages/web/dist to GitHub Pages.
# The client is a pure static SPA — login/content live on the remote
# core/server services (configurable in the app's settings).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_channel:
        description: Release channel for the existing live domain
        required: true
        default: stable
        type: choice
        options:
          - stable
          - preview-replacement

# Least-privilege token that the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  # A Pages deployment is atomic. A newer main commit must supersede an old
  # queued/building run instead of waiting behind stale work indefinitely.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Prereleases require a deliberate dispatch or this exact release's
      # checked-in intent. The existing main-only Pages protection still applies.
      - name: Validate release channel and branch
        id: release-channel
        env:
          REQUESTED_CHANNEL: ${{ inputs.release_channel || 'stable' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          let channel = process.env.REQUESTED_CHANNEL;
          const version = JSON.parse(readFileSync('packages/web/package.json', 'utf8')).version;
          const workspaceVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (process.env.GITHUB_REF !== 'refs/heads/main') {
            throw new Error('The live Pages domain can only be deployed from main');
          }
          if (version !== workspaceVersion) throw new Error('Web and workspace versions must match');
          let replacementPush = false;
          if (process.env.GITHUB_EVENT_NAME === 'push' && version === '2.5.2-beta.1') {
            const intent = JSON.parse(readFileSync('.github/pages-release.json', 'utf8'));
            if (intent.channel !== 'preview-replacement' || intent.version !== version) {
              throw new Error('The prerelease push requires the exact checked-in Pages replacement intent');
            }
            replacementPush = true;
            channel = 'preview-replacement';
          }
          let artifactChannel;
          if (channel === 'preview-replacement') {
            if (process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch' && !replacementPush) {
              throw new Error('A preview replacement requires a manual dispatch or the exact checked-in release intent');
            }
            if (!/^\d+\.\d+\.\d+-[0-9A-Za-z][0-9A-Za-z.-]*(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error('A preview replacement requires a prerelease package version');
            }
            artifactChannel = 'preview';
          } else if (channel === 'stable') {
            if (!/^\d+\.\d+\.\d+(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error('Stable Pages deployment rejects prerelease versions; dispatch preview-replacement explicitly');
            }
            artifactChannel = 'stable';
          } else {
            throw new Error('Unsupported Pages release channel');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `artifact_channel=${artifactChannel}`,
            `replaces_stable=${artifactChannel === 'preview'}`,
            '',
          ].join('\n'));
          console.log(`Validated ${channel} deployment of ${version} from ${process.env.GITHUB_REF}`);
          NODE

      - name: Install (workspace)
        run: pnpm install --frozen-lockfile

      # Gate the deploy. Every push to main goes straight to the live domain,
      # so a red suite must stop the publish rather than reach students.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # The changelog needs nothing from CI: which notes ship is decided by
      # CHANGELOG.md, which the release commit already carries.
      - name: Build web
        env:
          QED2_CHANNEL: ${{ steps.release-channel.outputs.artifact_channel }}
          QED2_PREVIEW_REPLACES_STABLE: ${{ steps.release-channel.outputs.replaces_stable }}
          QED2_DEFAULT_CORE: https://qedcore.barcarolle.studio
          QED2_DEFAULT_SERVER: https://qedsync.barcarolle.studio
        run: pnpm --filter @qed2/web build

      - name: Assert selected channel artifact
        working-directory: packages/web
        env:
          QED2_CHANNEL: ${{ steps.release-channel.outputs.artifact_channel }}
          QED2_PREVIEW_REPLACES_STABLE: ${{ steps.release-channel.outputs.replaces_stable }}
          QED2_DEFAULT_CORE: https://qedcore.barcarolle.studio
          QED2_DEFAULT_SERVER: https://qedsync.barcarolle.studio
          EXPECTED_CHANNEL: ${{ steps.release-channel.outputs.artifact_channel }}
        run: node scripts/assert-channel.mjs "$EXPECTED_CHANNEL"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
