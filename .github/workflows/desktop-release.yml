name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: Verify all packages without publishing, or publish an existing tag
        required: true
        default: verify-only
        type: choice
        options:
          - verify-only
          - publish
      ref:
        description: Branch or commit to rehearse in verify-only mode
        required: false
        default: preview
        type: string
      tag:
        description: Existing v-prefixed tag (required only in publish mode)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A tag push and a manual retry for that same tag must serialize against one
  # another: both mutate the same unpublished draft asset set.
  group: desktop-release-${{ github.event_name == 'push' && format('publish-{0}', github.ref_name) || inputs.mode == 'publish' && format('publish-{0}', inputs.tag) || format('verify-{0}', inputs.ref || 'preview') }}
  cancel-in-progress: false

env:
  QED2_CORE_SOURCE: ${{ github.workspace }}/qedv2-core
  QED2_BANK_SOURCE: ${{ github.workspace }}/srdpmppr
  QED2_EXPECTED_CORE_REPOSITORY: tangxiaoyi97/qedv2-core
  QED2_EXPECTED_CORE_REF: main
  QED2_EXPECTED_CORE_VERSION: 1.10.0
  QED2_EXPECTED_BANK_REPOSITORY: tangxiaoyi97/srdpmppr
  QED2_EXPECTED_BANK_REF: pastpapers
  QED2_EXPECTED_BANK_SHA: ff304623607463386026ebeebdbc17a576db1925
  QED2_EXPECTED_BANK_COMMIT_COUNT: '5'

jobs:
  release_context:
    name: Resolve immutable release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      client_sha: ${{ steps.release.outputs.client_sha }}
      core_sha: ${{ steps.release.outputs.core_sha }}
      bank_sha: ${{ steps.release.outputs.bank_sha }}
      tag_object_sha: ${{ steps.release.outputs.tag_object_sha }}
      publish: ${{ steps.release.outputs.publish }}
    defaults:
      run:
        working-directory: qedv2-client
    steps:
      - name: Validate private Core deploy key
        shell: bash
        working-directory: .
        env:
          DESKTOP_CORE_DEPLOY_KEY: ${{ secrets.DESKTOP_CORE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$DESKTOP_CORE_DEPLOY_KEY" ]]; then
            echo "Missing repository secret DESKTOP_CORE_DEPLOY_KEY for the private Core read-only deploy key." >&2
            exit 1
          fi

      - name: Check out release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || (inputs.mode == 'publish' && inputs.tag || inputs.ref) }}
          fetch-depth: 0
          path: qedv2-client
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Validate tag and locked release sources
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
          REQUESTED_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUBLISH_RELEASE=false
          TAG_OBJECT_SHA=''
          if [[ "$EVENT_NAME" == workflow_dispatch && "$DISPATCH_MODE" != verify-only && "$DISPATCH_MODE" != publish ]]; then
            echo "Unsupported manual release mode: $DISPATCH_MODE" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == push || "$DISPATCH_MODE" == publish ]]; then
            PUBLISH_RELEASE=true
            if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Publish mode requires a stable v-prefixed semantic version: $REQUESTED_TAG" >&2
              exit 1
            fi
          fi
          DESKTOP_VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          RELEASE_TAG="v$DESKTOP_VERSION"
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            if [[ "$REQUESTED_TAG" != "$RELEASE_TAG" ]]; then
              echo "Tag/desktop versions disagree: tag=$REQUESTED_TAG desktop=$DESKTOP_VERSION" >&2
              exit 1
            fi
          else
            REQUESTED_TAG="$RELEASE_TAG"
            TAG_ERROR="$RUNNER_TEMP/qed2-tag-lookup-error.txt"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>"$TAG_ERROR"; then
              echo "verify-only must run before $RELEASE_TAG exists" >&2
              exit 1
            elif ! grep -Fq 'HTTP 404' "$TAG_ERROR"; then
              cat "$TAG_ERROR" >&2
              echo "Could not prove that $RELEASE_TAG is absent; refusing verify-only." >&2
              exit 1
            fi
            RELEASE_ERROR="$RUNNER_TEMP/qed2-release-lookup-error.txt"
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>"$RELEASE_ERROR"; then
              echo "verify-only must run before a GitHub Release for $RELEASE_TAG exists" >&2
              exit 1
            elif ! grep -Fq 'HTTP 404' "$RELEASE_ERROR"; then
              cat "$RELEASE_ERROR" >&2
              echo "Could not prove that the $RELEASE_TAG GitHub Release is absent; refusing verify-only." >&2
              exit 1
            fi
          fi
          for PACKAGE_PATH in package.json packages/core-logic/package.json packages/ui/package.json packages/web/package.json; do
            PACKAGE_VERSION="$(node -p "require('./$PACKAGE_PATH').version")"
            if [[ "$PACKAGE_VERSION" != "$DESKTOP_VERSION" ]]; then
              echo "Version mismatch: $PACKAGE_PATH=$PACKAGE_VERSION desktop=$DESKTOP_VERSION" >&2
              exit 1
            fi
          done
          if ! grep -Fq "## $DESKTOP_VERSION —" CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for $DESKTOP_VERSION" >&2
            exit 1
          fi
          CLIENT_SHA="$(git rev-parse HEAD)"
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
            if [[ "$CLIENT_SHA" != "$MAIN_SHA" ]]; then
              echo "Release tag must resolve to the current origin/main head: tag=$CLIENT_SHA main=$MAIN_SHA" >&2
              exit 1
            fi
            if ! TAG_OBJECT_SHA="$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{tag}" 2>/dev/null)"; then
              echo "Release tag must be an annotated tag object: $REQUESTED_TAG" >&2
              exit 1
            fi
            TAG_COMMIT_SHA="$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")"
            if [[ ! "$TAG_OBJECT_SHA" =~ ^[0-9a-f]{40}$ || "$TAG_COMMIT_SHA" != "$CLIENT_SHA" ]]; then
              echo "Annotated release tag does not point directly to the frozen client commit." >&2
              exit 1
            fi
            REMOTE_TAG_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REQUESTED_TAG")"
            REMOTE_TAG_TYPE="$(jq -r '.object.type' <<< "$REMOTE_TAG_JSON")"
            REMOTE_TAG_OBJECT_SHA="$(jq -r '.object.sha' <<< "$REMOTE_TAG_JSON")"
            if [[ "$REMOTE_TAG_TYPE" != tag || "$REMOTE_TAG_OBJECT_SHA" != "$TAG_OBJECT_SHA" ]]; then
              echo "Remote release ref is not the frozen annotated tag object." >&2
              exit 1
            fi
            REMOTE_TAG_OBJECT_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA")"
            if [[ "$(jq -r '.object.type' <<< "$REMOTE_TAG_OBJECT_JSON")" != commit || \
                  "$(jq -r '.object.sha' <<< "$REMOTE_TAG_OBJECT_JSON")" != "$CLIENT_SHA" ]]; then
              echo "Annotated release tag must point directly to the frozen client commit." >&2
              exit 1
            fi
          fi
          RUNTIME_FORMAT_VERSION="$(node -p "require('./packages/desktop/runtime-sources.json').formatVersion")"
          CORE_REPOSITORY="$(node -p "require('./packages/desktop/runtime-sources.json').core.repository")"
          CORE_REF="$(node -p "require('./packages/desktop/runtime-sources.json').core.ref")"
          BANK_REPOSITORY="$(node -p "require('./packages/desktop/runtime-sources.json').bank.repository")"
          BANK_REF="$(node -p "require('./packages/desktop/runtime-sources.json').bank.ref")"
          CORE_SHA="$(node -p "require('./packages/desktop/runtime-sources.json').core.commit")"
          BANK_SHA="$(node -p "require('./packages/desktop/runtime-sources.json').bank.commit")"
          if [[ "$RUNTIME_FORMAT_VERSION" != 1 ]]; then
            echo "runtime-sources.json has an unsupported format version." >&2
            exit 1
          fi
          if [[ "$CORE_REPOSITORY" != "$QED2_EXPECTED_CORE_REPOSITORY" || "$CORE_REF" != "$QED2_EXPECTED_CORE_REF" ]]; then
            echo "runtime-sources.json must use the reviewed Core main source." >&2
            exit 1
          fi
          if [[ "$BANK_REPOSITORY" != "$QED2_EXPECTED_BANK_REPOSITORY" || "$BANK_REF" != "$QED2_EXPECTED_BANK_REF" ]]; then
            echo "runtime-sources.json must use the reviewed question-bank pastpapers source." >&2
            exit 1
          fi
          if [[ ! "$CORE_SHA" =~ ^[0-9a-f]{40}$ || ! "$BANK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "runtime-sources.json must pin full Git commit IDs" >&2
            exit 1
          fi
          if [[ "$BANK_SHA" != "$QED2_EXPECTED_BANK_SHA" ]]; then
            echo "Desktop must pin the reviewed question-bank commit $QED2_EXPECTED_BANK_SHA." >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$DESKTOP_VERSION" >> "$GITHUB_OUTPUT"
          echo "client_sha=$CLIENT_SHA" >> "$GITHUB_OUTPUT"
          echo "core_sha=$CORE_SHA" >> "$GITHUB_OUTPUT"
          echo "bank_sha=$BANK_SHA" >> "$GITHUB_OUTPUT"
          echo "tag_object_sha=$TAG_OBJECT_SHA" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Check out locked Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/qedv2-core
          ref: ${{ steps.release.outputs.core_sha }}
          fetch-depth: 0
          path: qedv2-core
          ssh-key: ${{ secrets.DESKTOP_CORE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out locked question bank
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/srdpmppr
          ref: ${{ steps.release.outputs.bank_sha }}
          fetch-depth: 0
          path: srdpmppr
          persist-credentials: false

      - name: Prove locked Core main and bank source identities
        shell: bash
        working-directory: .
        env:
          CORE_SHA: ${{ steps.release.outputs.core_sha }}
          BANK_SHA: ${{ steps.release.outputs.bank_sha }}
        run: |
          set -euo pipefail
          CORE_HEAD="$(git -C "$QED2_CORE_SOURCE" rev-parse HEAD)"
          CORE_MAIN="$(git -C "$QED2_CORE_SOURCE" rev-parse refs/remotes/origin/main)"
          BANK_HEAD="$(git -C "$QED2_BANK_SOURCE" rev-parse HEAD)"
          if [[ "$CORE_HEAD" != "$CORE_SHA" || "$CORE_MAIN" != "$CORE_SHA" ]]; then
            echo "Pinned Core must be exactly the current origin/main head: pin=$CORE_SHA head=$CORE_HEAD main=$CORE_MAIN" >&2
            exit 1
          fi
          CORE_VERSION="$(node -e "const p=require(process.argv[1]);process.stdout.write(String(p.version))" "$QED2_CORE_SOURCE/package.json")"
          if [[ "$CORE_VERSION" != "$QED2_EXPECTED_CORE_VERSION" ]]; then
            echo "Pinned Core version must be $QED2_EXPECTED_CORE_VERSION, found $CORE_VERSION." >&2
            exit 1
          fi
          if [[ "$BANK_SHA" != "$QED2_EXPECTED_BANK_SHA" || "$BANK_HEAD" != "$QED2_EXPECTED_BANK_SHA" ]]; then
            echo "Question-bank checkout does not match the reviewed fixed commit." >&2
            exit 1
          fi

  release_verify:
    name: Verify frozen release sources
    needs: release_context
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: qedv2-client
    steps:
      - name: Check out frozen client
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_context.outputs.client_sha }}
          path: qedv2-client
          persist-credentials: false

      - name: Check out frozen Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/qedv2-core
          ref: ${{ needs.release_context.outputs.core_sha }}
          fetch-depth: 0
          path: qedv2-core
          ssh-key: ${{ secrets.DESKTOP_CORE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out frozen question bank
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/srdpmppr
          ref: ${{ needs.release_context.outputs.bank_sha }}
          fetch-depth: 0
          path: srdpmppr
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            qedv2-client/pnpm-lock.yaml
            qedv2-core/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../qedv2-core install --frozen-lockfile

      - name: Verify complete client and Core release inputs
        run: |
          pnpm typecheck
          pnpm test
          pnpm --filter @qed2/desktop build
          pnpm --dir ../qedv2-core exec jest --runInBand
          pnpm --dir ../qedv2-core test:e2e

      - name: Prepare immutable bundled runtime
        run: |
          pnpm --filter @qed2/desktop runtime:prepare
          pnpm --filter @qed2/desktop runtime:smoke

      - name: Verify complete and deterministic revision vault
        shell: bash
        env:
          BANK_SHA: ${{ needs.release_context.outputs.bank_sha }}
        run: |
          set -euo pipefail
          EXPECTED_COMMITS="$RUNNER_TEMP/qed2-revision-commits.txt"
          REPEAT_ROOT="$(mktemp -d "$RUNNER_TEMP/qed2-revision-vault.XXXXXX")"
          REPEAT_VAULT="$REPEAT_ROOT/vault"
          cleanup_revision_vault() { rm -rf -- "$REPEAT_ROOT"; }
          trap cleanup_revision_vault EXIT

          if [[ "$(git -C "$QED2_BANK_SOURCE" rev-parse --is-shallow-repository)" != false ]]; then
            echo "Revision-vault proof requires the complete question-bank history." >&2
            exit 1
          fi
          git -C "$QED2_BANK_SOURCE" rev-list --reverse --topo-order "$BANK_SHA" > "$EXPECTED_COMMITS"
          if [[ "$(wc -l < "$EXPECTED_COMMITS" | tr -d '[:space:]')" != "$QED2_EXPECTED_BANK_COMMIT_COUNT" ]]; then
            echo "Question-bank ancestry no longer contains exactly $QED2_EXPECTED_BANK_COMMIT_COUNT commits." >&2
            exit 1
          fi

          node "$QED2_CORE_SOURCE/dist/revisions/generate-revision-vault.js" \
            --bank "$QED2_BANK_SOURCE" \
            --output "$REPEAT_VAULT" \
            --commit "$BANK_SHA" \
            --repository "https://github.com/$QED2_EXPECTED_BANK_REPOSITORY" \
            --ref "$QED2_EXPECTED_BANK_REF" \
            --schema-min 2 \
            --schema-max 3

          node --input-type=module - \
            "$PWD/packages/desktop/runtime" \
            "$REPEAT_VAULT" \
            "$EXPECTED_COMMITS" \
            "$BANK_SHA" \
            "$QED2_EXPECTED_BANK_COMMIT_COUNT" \
            "https://github.com/$QED2_EXPECTED_BANK_REPOSITORY" \
            "$QED2_EXPECTED_BANK_REF" <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { lstat, readFile, readdir } from 'node:fs/promises';
          import path from 'node:path';

          const [runtimeRoot, repeatedVault, commitsFile, pinnedCommit, expectedCountText, repository, ref] =
            process.argv.slice(2);
          const expectedCount = Number(expectedCountText);
          const primaryVault = path.join(runtimeRoot, 'bank', 'revisions');
          const expectedCommits = (await readFile(commitsFile, 'utf8')).trim().split('\n').filter(Boolean);
          const sha256 = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const isRecord = (value) => value !== null && typeof value === 'object' && !Array.isArray(value);
          const fullGitSha = /^[0-9a-f]{40}$/u;
          const sha256Digest = /^[0-9a-f]{64}$/u;

          assert.equal(expectedCommits.length, expectedCount, 'full bank ancestry count changed');
          assert.equal(expectedCommits.at(-1), pinnedCommit, 'bank ancestry does not end at the pin');
          assert.equal(new Set(expectedCommits).size, expectedCommits.length, 'bank ancestry contains duplicates');
          assert.ok(expectedCommits.every((commit) => fullGitSha.test(commit)), 'bank ancestry contains an invalid commit');

          async function inventory(root) {
            const files = [];
            async function visit(directory, prefix = '') {
              const entries = await readdir(directory, { withFileTypes: true });
              entries.sort((left, right) => left.name.localeCompare(right.name, 'en'));
              for (const entry of entries) {
                const relative = prefix ? `${prefix}/${entry.name}` : entry.name;
                const absolute = path.join(directory, entry.name);
                const info = await lstat(absolute);
                assert.equal(info.isSymbolicLink(), false, `vault contains symlink: ${relative}`);
                if (info.isDirectory()) {
                  await visit(absolute, relative);
                } else {
                  assert.equal(info.isFile(), true, `vault contains unsupported entry: ${relative}`);
                  const bytes = await readFile(absolute);
                  files.push({ path: relative, size: bytes.byteLength, sha256: sha256(bytes) });
                }
              }
            }
            await visit(root);
            return files;
          }

          async function validateVault(vaultRoot) {
            const catalogPath = path.join(vaultRoot, 'revision-catalog.v1.json');
            const catalogBytes = await readFile(catalogPath);
            const catalog = JSON.parse(catalogBytes.toString('utf8'));
            assert.equal(catalog.formatVersion, 1, 'revision catalog format changed');
            assert.equal(catalog.repository, repository, 'revision catalog repository changed');
            assert.equal(catalog.ref, ref, 'revision catalog ref changed');
            assert.equal(catalog.pinnedCommit, pinnedCommit, 'revision catalog pin changed');
            assert.deepEqual(catalog.commitOrder, expectedCommits, 'catalog does not cover full git rev-list');
            assert.equal(catalog.commitOrder.length, expectedCount, 'catalog commit count changed');
            assert.ok(isRecord(catalog.commits), 'catalog commits must be an object');
            assert.ok(isRecord(catalog.objects), 'catalog objects must be an object');
            assert.deepEqual(
              Object.keys(catalog.commits).sort(),
              [...expectedCommits].sort(),
              'catalog commit records are incomplete',
            );

            const referencedObjects = new Set();
            let questionRevisionCount = 0;
            for (const commit of expectedCommits) {
              const record = catalog.commits[commit];
              assert.ok(isRecord(record?.questions), `invalid question records for ${commit}`);
              assert.ok(isRecord(record?.assets), `invalid asset records for ${commit}`);
              for (const question of Object.values(record.questions)) {
                assert.ok(isRecord(question), `invalid question metadata for ${commit}`);
                assert.match(question.wireObjectSha256, sha256Digest, 'invalid question object digest');
                const object = catalog.objects[question.wireObjectSha256];
                assert.equal(object?.kind, 'question', 'question object kind mismatch');
                assert.equal(object?.bytes, question.wireBytes, 'question object size mismatch');
                referencedObjects.add(question.wireObjectSha256);
                questionRevisionCount += 1;
              }
              for (const asset of Object.values(record.assets)) {
                assert.ok(isRecord(asset), `invalid asset metadata for ${commit}`);
                assert.match(asset.objectSha256, sha256Digest, 'invalid asset object digest');
                const object = catalog.objects[asset.objectSha256];
                assert.equal(object?.kind, 'asset', 'asset object kind mismatch');
                assert.equal(object?.bytes, asset.bytes, 'asset object size mismatch');
                assert.equal(object?.mimeType, asset.mimeType, 'asset MIME mismatch');
                referencedObjects.add(asset.objectSha256);
              }
            }

            const objectEntries = Object.entries(catalog.objects);
            assert.deepEqual(
              [...referencedObjects].sort(),
              objectEntries.map(([digest]) => digest).sort(),
              'catalog has missing or unreferenced objects',
            );
            let objectBytes = 0;
            for (const [digest, metadata] of objectEntries) {
              assert.match(digest, sha256Digest, 'invalid catalog object digest');
              assert.ok(isRecord(metadata), `invalid object metadata: ${digest}`);
              assert.ok(Number.isSafeInteger(metadata.bytes) && metadata.bytes >= 0, `invalid object size: ${digest}`);
              const objectPath = path.join(vaultRoot, 'objects', digest.slice(0, 2), digest.slice(2));
              const info = await lstat(objectPath);
              assert.equal(info.isFile() && !info.isSymbolicLink(), true, `object is not a regular file: ${digest}`);
              const bytes = await readFile(objectPath);
              assert.equal(bytes.byteLength, metadata.bytes, `object length mismatch: ${digest}`);
              assert.equal(sha256(bytes), digest, `object SHA-256 mismatch: ${digest}`);
              objectBytes += bytes.byteLength;
            }

            const files = await inventory(vaultRoot);
            const actualObjectPaths = files
              .filter((file) => file.path !== 'revision-catalog.v1.json')
              .map((file) => file.path)
              .sort();
            const expectedObjectPaths = objectEntries
              .map(([digest]) => `objects/${digest.slice(0, 2)}/${digest.slice(2)}`)
              .sort();
            assert.deepEqual(actualObjectPaths, expectedObjectPaths, 'vault has missing or unexpected object files');
            return { catalogBytes, files, objectBytes, objectCount: objectEntries.length, questionRevisionCount };
          }

          const primary = await validateVault(primaryVault);
          const repeated = await validateVault(repeatedVault);
          assert.deepEqual(primary.catalogBytes, repeated.catalogBytes, 'second catalog generation is not deterministic');
          assert.deepEqual(primary.files, repeated.files, 'second vault generation is not byte-for-byte deterministic');

          const manifest = JSON.parse(await readFile(path.join(runtimeRoot, 'runtime-manifest.json'), 'utf8'));
          assert.equal(manifest.formatVersion, 3, 'Desktop runtime manifest must be v3');
          assert.equal(manifest.bank?.commit, pinnedCommit, 'runtime bank pin differs from revision vault');
          assert.equal(manifest.revisions?.catalog, 'bank/revisions/revision-catalog.v1.json');
          assert.equal(manifest.revisions?.formatVersion, 1);
          assert.equal(manifest.revisions?.pinnedCommit, pinnedCommit);
          assert.equal(manifest.revisions?.commitCount, expectedCount);
          assert.equal(manifest.revisions?.questionRevisionCount, primary.questionRevisionCount);
          assert.equal(manifest.revisions?.objectCount, primary.objectCount);
          assert.equal(manifest.revisions?.objectBytes, primary.objectBytes);
          const manifestFiles = new Map(manifest.files.map((file) => [file.path, file]));
          for (const file of primary.files) {
            const record = manifestFiles.get(`bank/revisions/${file.path}`);
            assert.equal(record?.type, 'file', `runtime manifest omits vault file ${file.path}`);
            assert.equal(record?.size, file.size, `runtime manifest size differs for ${file.path}`);
            assert.equal(record?.sha256, file.sha256, `runtime manifest digest differs for ${file.path}`);
          }
          NODE

          trap - EXIT
          cleanup_revision_vault

  macos:
    name: macOS ${{ matrix.arch }} ad-hoc signed
    needs: [release_context, release_verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: qedv2-client
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Check out frozen client
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_context.outputs.client_sha }}
          path: qedv2-client
          persist-credentials: false

      - name: Check out frozen Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/qedv2-core
          ref: ${{ needs.release_context.outputs.core_sha }}
          fetch-depth: 0
          path: qedv2-core
          ssh-key: ${{ secrets.DESKTOP_CORE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out frozen question bank
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/srdpmppr
          ref: ${{ needs.release_context.outputs.bank_sha }}
          fetch-depth: 0
          path: srdpmppr
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            qedv2-client/pnpm-lock.yaml
            qedv2-core/pnpm-lock.yaml

      - name: Cache Electron toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: desktop-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qedv2-client/pnpm-lock.yaml') }}
          restore-keys: |
            desktop-electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../qedv2-core install --frozen-lockfile

      - name: Prepare runtime and build
        run: |
          pnpm --filter @qed2/desktop runtime:prepare
          pnpm --filter @qed2/desktop runtime:smoke
          pnpm --filter @qed2/desktop build

      - name: Build structurally signed, unnotarized packages
        run: >-
          pnpm --filter @qed2/desktop exec electron-builder
          --config electron-builder.unsigned.yml
          --mac --${{ matrix.arch }} --publish never

      - name: Verify runtime copied into macOS package
        run: pnpm --filter @qed2/desktop exec node scripts/smoke-runtime.mjs --packaged

      - name: Verify complete ad-hoc signature and unsigned release marker
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="packages/desktop/dist-packages"
          shopt -s nullglob
          DMGS=("$ARTIFACT_ROOT"/*.dmg)
          ZIPS=("$ARTIFACT_ROOT"/*.zip)
          if [[ "${#DMGS[@]}" -ne 1 || "${#ZIPS[@]}" -ne 1 ]]; then
            echo "Expected exactly one DMG and one ZIP for this architecture." >&2
            exit 1
          fi

          verify_app() {
            local candidate="$1"
            codesign --verify --deep --strict --verbose=2 "$candidate"
            local signature
            signature="$(codesign -dvvv "$candidate" 2>&1)"
            grep -Fq 'Signature=adhoc' <<< "$signature"
            grep -Fq 'TeamIdentifier=not set' <<< "$signature"
            grep -Eq 'Sealed Resources version=2 .* files=[1-9][0-9]*' <<< "$signature"
            local marker="$candidate/Contents/Resources/qed2-unsigned-release.json"
            test -f "$marker"
            test ! -L "$marker"
            node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(JSON.stringify(v)!==JSON.stringify({formatVersion:1,selfUpdate:'manual-only'}))process.exit(1)" "$marker"
          }

          APPS=("$ARTIFACT_ROOT"/mac*/QED2.app)
          if [[ "${#APPS[@]}" -ne 1 ]]; then
            echo "Expected one unpacked QED2.app, found ${#APPS[@]}" >&2
            exit 1
          fi
          verify_app "${APPS[0]}"

          unzip -t "${ZIPS[0]}"
          ZIP_ROOT="$(mktemp -d)"
          DMG_MOUNT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$DMG_MOUNT" -quiet 2>/dev/null || true
            rm -rf "$ZIP_ROOT" "$DMG_MOUNT"
          }
          trap cleanup EXIT

          ditto -x -k "${ZIPS[0]}" "$ZIP_ROOT"
          ZIP_APPS=("$ZIP_ROOT"/QED2.app "$ZIP_ROOT"/*/QED2.app)
          if [[ "${#ZIP_APPS[@]}" -ne 1 ]]; then
            echo "Expected one QED2.app in the ZIP, found ${#ZIP_APPS[@]}" >&2
            exit 1
          fi
          verify_app "${ZIP_APPS[0]}"

          hdiutil verify "${DMGS[0]}"
          hdiutil attach "${DMGS[0]}" -nobrowse -readonly -mountpoint "$DMG_MOUNT"
          DMG_APPS=("$DMG_MOUNT"/QED2.app "$DMG_MOUNT"/*/QED2.app)
          if [[ "${#DMG_APPS[@]}" -ne 1 ]]; then
            echo "Expected one QED2.app in the DMG, found ${#DMG_APPS[@]}" >&2
            exit 1
          fi
          verify_app "${DMG_APPS[0]}"
          hdiutil detach "$DMG_MOUNT"
          trap - EXIT
          cleanup

      - name: Boot-smoke ad-hoc signed macOS application
        run: >-
          pnpm --filter @qed2/desktop exec node scripts/smoke-packaged-app.mjs
          --diagnostics-dir "${{ runner.temp }}/qed2-packaged-smoke"

      - name: Upload macOS boot-smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos-${{ matrix.arch }}-boot-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/qed2-packaged-smoke

      - name: Upload macOS release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          path: |
            qedv2-client/packages/desktop/dist-packages/*.dmg
            qedv2-client/packages/desktop/dist-packages/*.zip
            qedv2-client/packages/desktop/dist-packages/*.zip.blockmap

  windows:
    name: Windows x64 unsigned
    needs: [release_context, release_verify]
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        working-directory: qedv2-client
    steps:
      - name: Check out frozen client
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_context.outputs.client_sha }}
          path: qedv2-client
          persist-credentials: false

      - name: Check out frozen Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/qedv2-core
          ref: ${{ needs.release_context.outputs.core_sha }}
          fetch-depth: 0
          path: qedv2-core
          ssh-key: ${{ secrets.DESKTOP_CORE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out frozen question bank
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/srdpmppr
          ref: ${{ needs.release_context.outputs.bank_sha }}
          fetch-depth: 0
          path: srdpmppr
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            qedv2-client/pnpm-lock.yaml
            qedv2-core/pnpm-lock.yaml

      - name: Cache Electron toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: desktop-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qedv2-client/pnpm-lock.yaml') }}
          restore-keys: |
            desktop-electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../qedv2-core install --frozen-lockfile

      - name: Prepare runtime and build
        run: |
          pnpm --filter @qed2/desktop runtime:prepare
          pnpm --filter @qed2/desktop runtime:smoke
          pnpm --filter @qed2/desktop build

      - name: Build unsigned NSIS installer
        run: >-
          pnpm --filter @qed2/desktop exec electron-builder
          --config electron-builder.unsigned.yml
          --win --x64 --publish never

      - name: Verify runtime copied into Windows package
        run: pnpm --filter @qed2/desktop exec node scripts/smoke-runtime.mjs --packaged

      - name: Verify unsigned installer and manual-update marker
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem packages/desktop/dist-packages -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Unsigned release unexpectedly has Authenticode status $($signature.Status): $($signature.StatusMessage)"
          }
          $marker = 'packages/desktop/dist-packages/win-unpacked/resources/qed2-unsigned-release.json'
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) {
            throw 'Unsigned release marker is missing from win-unpacked.'
          }
          $value = Get-Content -LiteralPath $marker -Raw | ConvertFrom-Json
          if ($value.formatVersion -ne 1 -or $value.selfUpdate -ne 'manual-only') {
            throw 'Unsigned release marker is invalid.'
          }

      - name: Boot-smoke unsigned Windows application
        run: >-
          pnpm --filter @qed2/desktop exec node scripts/smoke-packaged-app.mjs
          --diagnostics-dir "${{ runner.temp }}/qed2-packaged-smoke"

      - name: Upload Windows boot-smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-x64-boot-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/qed2-packaged-smoke

      - name: Upload Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-x64
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          path: |
            qedv2-client/packages/desktop/dist-packages/*.exe
            qedv2-client/packages/desktop/dist-packages/*.blockmap
            qedv2-client/packages/desktop/dist-packages/latest.yml

  linux:
    name: Linux x64 unsigned packages
    needs: [release_context, release_verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: qedv2-client
    steps:
      - name: Check out frozen client
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_context.outputs.client_sha }}
          path: qedv2-client
          persist-credentials: false

      - name: Check out frozen Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/qedv2-core
          ref: ${{ needs.release_context.outputs.core_sha }}
          fetch-depth: 0
          path: qedv2-core
          ssh-key: ${{ secrets.DESKTOP_CORE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out frozen question bank
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/srdpmppr
          ref: ${{ needs.release_context.outputs.bank_sha }}
          fetch-depth: 0
          path: srdpmppr
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            qedv2-client/pnpm-lock.yaml
            qedv2-core/pnpm-lock.yaml

      - name: Cache Electron toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qedv2-client/pnpm-lock.yaml') }}
          restore-keys: |
            desktop-electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cpio rpm xvfb

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../qedv2-core install --frozen-lockfile

      - name: Prepare runtime and build
        run: |
          pnpm --filter @qed2/desktop runtime:prepare
          pnpm --filter @qed2/desktop runtime:smoke
          pnpm --filter @qed2/desktop build

      - name: Build AppImage, deb and rpm
        run: >-
          pnpm --filter @qed2/desktop exec electron-builder
          --config electron-builder.unsigned.yml
          --linux --x64 --publish never

      - name: Verify runtime copied into Linux package tree
        run: pnpm --filter @qed2/desktop exec node scripts/smoke-runtime.mjs --packaged

      - name: Verify Linux package set
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="packages/desktop/dist-packages"
          mapfile -t APPIMAGES < <(find "$ARTIFACT_ROOT" -maxdepth 1 -type f -name '*.AppImage')
          mapfile -t DEBS < <(find "$ARTIFACT_ROOT" -maxdepth 1 -type f -name '*.deb')
          mapfile -t RPMS < <(find "$ARTIFACT_ROOT" -maxdepth 1 -type f -name '*.rpm')
          test "${#APPIMAGES[@]}" -eq 1
          test "${#DEBS[@]}" -eq 1
          test "${#RPMS[@]}" -eq 1
          RELEASE_VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          test -f "$ARTIFACT_ROOT/QED2-$RELEASE_VERSION-linux-x64.AppImage"
          test -f "$ARTIFACT_ROOT/QED2-$RELEASE_VERSION-linux-x64.deb"
          test -f "$ARTIFACT_ROOT/QED2-$RELEASE_VERSION-linux-x64.rpm"
          dpkg-deb --info "${DEBS[0]}" >/dev/null
          rpm --query --package --info "${RPMS[0]}" >/dev/null
          MARKER="$ARTIFACT_ROOT/linux-unpacked/resources/qed2-unsigned-release.json"
          test -f "$MARKER"
          test ! -L "$MARKER"
          node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(JSON.stringify(v)!==JSON.stringify({formatVersion:1,selfUpdate:'manual-only'}))process.exit(1)" "$MARKER"

          VERIFY_ROOT="$(mktemp -d)"
          cleanup_packages() { rm -rf "$VERIFY_ROOT"; }
          trap cleanup_packages EXIT
          mkdir -p "$VERIFY_ROOT/appimage" "$VERIFY_ROOT/deb" "$VERIFY_ROOT/rpm"
          APPIMAGE_PATH="$(realpath "${APPIMAGES[0]}")"
          DEB_PATH="$(realpath "${DEBS[0]}")"
          RPM_PATH="$(realpath "${RPMS[0]}")"
          (cd "$VERIFY_ROOT/appimage" && "$APPIMAGE_PATH" --appimage-extract >/dev/null)
          dpkg-deb --extract "$DEB_PATH" "$VERIFY_ROOT/deb"
          (cd "$VERIFY_ROOT/rpm" && rpm2cpio "$RPM_PATH" | cpio --extract --make-directories --quiet)

          for PACKAGE_ROOT in "$VERIFY_ROOT/appimage" "$VERIFY_ROOT/deb" "$VERIFY_ROOT/rpm"; do
            mapfile -t MARKERS < <(find "$PACKAGE_ROOT" -type f -name 'qed2-unsigned-release.json')
            if [[ "${#MARKERS[@]}" -ne 1 || -L "${MARKERS[0]:-}" ]]; then
              echo "Expected exactly one regular unsigned release marker in $PACKAGE_ROOT." >&2
              exit 1
            fi
            node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(JSON.stringify(v)!==JSON.stringify({formatVersion:1,selfUpdate:'manual-only'}))process.exit(1)" "${MARKERS[0]}"
          done
          trap - EXIT
          cleanup_packages

      - name: Configure Chromium sandbox for Linux boot smoke
        shell: bash
        run: |
          set -euo pipefail
          SANDBOX="packages/desktop/dist-packages/linux-unpacked/chrome-sandbox"
          test -f "$SANDBOX"
          test ! -L "$SANDBOX"
          sudo chown root:root -- "$SANDBOX"
          sudo chmod 4755 -- "$SANDBOX"
          test "$(stat -c '%u:%g:%a' "$SANDBOX")" = '0:0:4755'

      - name: Boot-smoke Linux application under virtual display
        run: >-
          pnpm --filter @qed2/desktop exec node scripts/smoke-packaged-app.mjs
          --diagnostics-dir "${{ runner.temp }}/qed2-packaged-smoke"

      - name: Upload Linux boot-smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-linux-x64-boot-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/qed2-packaged-smoke

      - name: Upload Linux release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-linux-x64
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          path: |
            qedv2-client/packages/desktop/dist-packages/*.AppImage
            qedv2-client/packages/desktop/dist-packages/*.deb
            qedv2-client/packages/desktop/dist-packages/*.rpm
            qedv2-client/packages/desktop/dist-packages/latest-linux.yml

  assemble:
    name: Assemble and verify complete release set
    needs: [release_context, macos, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_context.outputs.client_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The final verifier reuses the exact BLAKE2 implementation pinned by
      # electron-builder to recompute every differential-update block. Install
      # only the Desktop dependency graph and disable lifecycle scripts: this
      # keeps the assembly job reproducible without downloading Electron again.
      - name: Install release verifier dependencies
        run: pnpm --filter @qed2/desktop install --frozen-lockfile --ignore-scripts

      - name: Download verified assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Record unsigned distribution limitations
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release_context.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "QED2 $RELEASE_VERSION ships without paid platform signing identities." \
            'macOS applications are completely ad-hoc signed but not Apple-notarized.' \
            'Windows installers have no Authenticode signature.' \
            'Linux packages have no publisher signature.' \
            'QED2 verifies and resumes the package download, then requires manual installation.' \
            'Only download artifacts from this GitHub release and verify SHA256SUMS.' \
            > release-assets/UNSIGNED-BUILD-NOTICE.txt

      # The two native macOS jobs produce independent per-architecture assets.
      # Assemble one compatibility manifest that inventories both verified ZIPs.
      - name: Assemble macOS multi-architecture update metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release_context.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t MAC_ZIPS < <(find release-assets -maxdepth 1 -type f -name 'QED2-*-mac-*.zip' -printf '%f\n' | sort)
          if [[ "${#MAC_ZIPS[@]}" -ne 2 ]]; then
            echo "Expected x64 and arm64 macOS ZIPs, found ${#MAC_ZIPS[@]}" >&2
            exit 1
          fi
          LEGACY_PATH="$(printf '%s\n' "${MAC_ZIPS[@]}" | grep -- '-x64\.zip$')"
          {
            printf 'version: %s\n' "$RELEASE_VERSION"
            printf 'files:\n'
            for ARCHIVE in "${MAC_ZIPS[@]}"; do
              SHA512="$(openssl dgst -sha512 -binary "release-assets/$ARCHIVE" | openssl base64 -A)"
              SIZE="$(stat -c '%s' "release-assets/$ARCHIVE")"
              printf '  - url: %s\n    sha512: %s\n    size: %s\n' "$ARCHIVE" "$SHA512" "$SIZE"
            done
            LEGACY_SHA512="$(openssl dgst -sha512 -binary "release-assets/$LEGACY_PATH" | openssl base64 -A)"
            printf "path: %s\nsha512: %s\nreleaseDate: '%s'\n" \
              "$LEGACY_PATH" "$LEGACY_SHA512" "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          } > release-assets/latest-mac.yml

      - name: Verify complete release set and record provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release_context.outputs.tag }}
          CLIENT_SHA: ${{ needs.release_context.outputs.client_sha }}
          TAG_OBJECT_SHA: ${{ needs.release_context.outputs.tag_object_sha }}
          CORE_SHA: ${{ needs.release_context.outputs.core_sha }}
          BANK_SHA: ${{ needs.release_context.outputs.bank_sha }}
          PUBLISH_RELEASE: ${{ needs.release_context.outputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            REMOTE_TAG_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
            if [[ "$(jq -r '.object.type' <<< "$REMOTE_TAG_JSON")" != tag || \
                  "$(jq -r '.object.sha' <<< "$REMOTE_TAG_JSON")" != "$TAG_OBJECT_SHA" ]]; then
              echo "Annotated release tag object moved during release assembly." >&2
              exit 1
            fi
            REMOTE_TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
            if [[ "$REMOTE_TAG_SHA" != "$CLIENT_SHA" ]]; then
              echo "Release tag moved during the run: expected $CLIENT_SHA, found $REMOTE_TAG_SHA" >&2
              exit 1
            fi
            REMOTE_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [[ "$REMOTE_MAIN_SHA" != "$CLIENT_SHA" ]]; then
              echo "origin/main moved during the release: expected $CLIENT_SHA, found $REMOTE_MAIN_SHA" >&2
              exit 1
            fi
          fi
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.rpm' | wc -l)" -eq 1
          test -f release-assets/latest.yml
          test -f release-assets/latest-mac.yml
          test -f release-assets/latest-linux.yml
          printf 'QED2 desktop release %s\nclient %s\ncore main %s\nbank pastpapers %s\n' \
            "$RELEASE_TAG" "$CLIENT_SHA" "$CORE_SHA" "$BANK_SHA" \
            > release-assets/runtime-sources.txt

          node packages/desktop/scripts/verify-release-assets.mjs \
            --root release-assets \
            --version "${RELEASE_TAG#v}" \
            --tag "$RELEASE_TAG" \
            --client-sha "$CLIENT_SHA" \
            --core-sha "$CORE_SHA" \
            --bank-sha "$BANK_SHA"

      - name: Recheck assembled checksums
        shell: bash
        run: (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Upload assembled release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qed2-release-assembled
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          path: release-assets/*

  publish:
    name: Publish verified GitHub Release
    if: needs.release_context.outputs.publish == 'true'
    needs: [release_context, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: desktop-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download assembled release set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qed2-release-assembled
          path: release-assets

      - name: Revalidate frozen tag, main and assembled bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_context.outputs.tag }}
          CLIENT_SHA: ${{ needs.release_context.outputs.client_sha }}
          TAG_OBJECT_SHA: ${{ needs.release_context.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS)
          ASSET_NAMES="$RUNNER_TEMP/qed2-release-asset-names.txt"
          CHECKSUM_ASSET_NAMES="$RUNNER_TEMP/qed2-checksum-release-asset-names.txt"
          find release-assets -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "$ASSET_NAMES"
          {
            sed -E 's/^[0-9a-f]{64}  //' release-assets/SHA256SUMS
            printf 'SHA256SUMS\n'
          } | LC_ALL=C sort > "$CHECKSUM_ASSET_NAMES"
          if [[ "$(wc -l < "$ASSET_NAMES" | tr -d '[:space:]')" != 18 ]] || \
             ! cmp -s "$CHECKSUM_ASSET_NAMES" "$ASSET_NAMES"; then
            echo "The publish job did not receive the canonical 18-file release set." >&2
            diff -u "$CHECKSUM_ASSET_NAMES" "$ASSET_NAMES" || true
            exit 1
          fi
          REMOTE_TAG_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          if [[ "$(jq -r '.object.type' <<< "$REMOTE_TAG_JSON")" != tag || \
                "$(jq -r '.object.sha' <<< "$REMOTE_TAG_JSON")" != "$TAG_OBJECT_SHA" ]]; then
            echo "Annotated release tag object moved before attestation." >&2
            exit 1
          fi
          REMOTE_TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$REMOTE_TAG_SHA" != "$CLIENT_SHA" ]]; then
            echo "Release tag moved before attestation: expected $CLIENT_SHA, found $REMOTE_TAG_SHA" >&2
            exit 1
          fi
          REMOTE_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$REMOTE_MAIN_SHA" != "$CLIENT_SHA" ]]; then
            echo "origin/main moved before attestation: expected $CLIENT_SHA, found $REMOTE_MAIN_SHA" >&2
            exit 1
          fi

      - name: Attest release build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*

      - name: Stage, verify and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_context.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release_context.outputs.version }}
          CLIENT_SHA: ${{ needs.release_context.outputs.client_sha }}
          TAG_OBJECT_SHA: ${{ needs.release_context.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS)
          ASSET_NAMES="$RUNNER_TEMP/qed2-release-asset-names.txt"
          CHECKSUM_ASSET_NAMES="$RUNNER_TEMP/qed2-checksum-release-asset-names.txt"
          find release-assets -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "$ASSET_NAMES"
          {
            sed -E 's/^[0-9a-f]{64}  //' release-assets/SHA256SUMS
            printf 'SHA256SUMS\n'
          } | LC_ALL=C sort > "$CHECKSUM_ASSET_NAMES"
          if [[ "$(wc -l < "$ASSET_NAMES" | tr -d '[:space:]')" != 18 ]] || \
             ! cmp -s "$CHECKSUM_ASSET_NAMES" "$ASSET_NAMES"; then
            echo "The publish job did not receive the canonical 18-file release set." >&2
            diff -u "$CHECKSUM_ASSET_NAMES" "$ASSET_NAMES" || true
            exit 1
          fi
          # GitHub's release-by-tag REST endpoint excludes drafts. Enumerate all
          # pages so a retry reuses the one private draft instead of attempting
          # to create a duplicate or mistaking it for a published release.
          RELEASE_PAGES="$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100"
          )"
          RELEASE_MATCHES="$(
            jq -c --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)]' <<< "$RELEASE_PAGES"
          )"
          RELEASE_MATCH_COUNT="$(jq 'length' <<< "$RELEASE_MATCHES")"
          if [[ "$RELEASE_MATCH_COUNT" -gt 1 ]]; then
            echo "GitHub returned multiple releases for the immutable tag $RELEASE_TAG." >&2
            exit 1
          elif [[ "$RELEASE_MATCH_COUNT" -eq 1 ]]; then
            RELEASE_JSON="$(jq -c '.[0]' <<< "$RELEASE_MATCHES")"
          else
            # Never expose a release while assets are still being transferred.
            # A failed upload leaves only a resumable draft.
            RELEASE_JSON="$(
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                --raw-field tag_name="$RELEASE_TAG" \
                --raw-field target_commitish="$CLIENT_SHA" \
                --raw-field name="QED2 $RELEASE_VERSION" \
                --field draft=true \
                --field prerelease=false \
                --field generate_release_notes=true
            )"
          fi

          if [[ "$(jq -r '.draft' <<< "$RELEASE_JSON")" != true ]]; then
            echo "Release $RELEASE_TAG is already published and must not be replaced; publish a higher version." >&2
            exit 1
          fi
          if [[ "$(jq -r '.author.login' <<< "$RELEASE_JSON")" != 'github-actions[bot]' ]]; then
            echo "Refusing to reuse a draft that was not created by GitHub Actions." >&2
            exit 1
          fi

          RELEASE_ID="$(jq -r '.id' <<< "$RELEASE_JSON")"
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "GitHub returned an invalid draft release ID." >&2
            exit 1
          fi
          RELEASE_API="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"

          NOTICE="⚠️ QED2 $RELEASE_VERSION packages use no paid platform identity: macOS is ad-hoc signed and not notarized; Windows and Linux are unsigned. QED2 verifies downloads but requires manual installation, and the OS may warn you. Use only this GitHub release and verify SHA256SUMS."
          CURRENT_BODY="$(jq -r '.body // ""' <<< "$RELEASE_JSON")"
          if [[ "$CURRENT_BODY" != *"$NOTICE"* ]]; then
            UPDATED_BODY="$(printf '%s\n\n%s' "$NOTICE" "$CURRENT_BODY")"
            gh api --method PATCH "$RELEASE_API" \
              --raw-field tag_name="$RELEASE_TAG" \
              --raw-field target_commitish="$CLIENT_SHA" \
              --raw-field body="$UPDATED_BODY" >/dev/null
            RELEASE_JSON="$(gh api "$RELEASE_API")"
          fi
          if ! jq -e --arg tag "$RELEASE_TAG" --arg target "$CLIENT_SHA" \
            '.tag_name == $tag and .target_commitish == $target and .draft == true' \
            <<< "$RELEASE_JSON" >/dev/null; then
            echo "GitHub detached the private draft from the immutable release tag." >&2
            exit 1
          fi

          # A retry starts from an exact empty asset set. This prevents a stale
          # payload from a prior failed workflow (or manual draft edit) from
          # being made public alongside the locally verified release.
          EXISTING_ASSET_PAGES="$(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100"
          )"
          EXISTING_ASSET_IDS="$RUNNER_TEMP/qed2-existing-release-asset-ids.txt"
          jq -r '.[][] | .id' <<< "$EXISTING_ASSET_PAGES" > "$EXISTING_ASSET_IDS"
          while IFS= read -r ASSET_ID; do
            [[ "$ASSET_ID" =~ ^[0-9]+$ ]] || {
              echo "GitHub returned an invalid draft asset ID." >&2
              exit 1
            }
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          done < "$EXISTING_ASSET_IDS"

          while IFS= read -r ASSET_NAME; do
            ASSET_PATH="release-assets/$ASSET_NAME"
            ENCODED_ASSET_NAME="$(jq -rn --arg value "$ASSET_NAME" '$value | @uri')"
            UPLOADED_ASSET="$(
              gh api --method POST \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ENCODED_ASSET_NAME" \
                --header 'Content-Type: application/octet-stream' \
                --input "$ASSET_PATH"
            )"
            ASSET_SIZE="$(stat -c '%s' "$ASSET_PATH")"
            if ! jq -e --arg name "$ASSET_NAME" --argjson size "$ASSET_SIZE" \
              '.name == $name and .size == $size and .state == "uploaded" and (.id | type) == "number"' \
              <<< "$UPLOADED_ASSET" >/dev/null; then
              echo "GitHub did not confirm the uploaded draft asset: $ASSET_NAME" >&2
              exit 1
            fi
          done < "$ASSET_NAMES"

          EXPECTED_API_ASSETS="$RUNNER_TEMP/qed2-expected-release-assets.tsv"
          REMOTE_API_ASSETS="$RUNNER_TEMP/qed2-remote-release-assets.tsv"
          while IFS= read -r ASSET_NAME; do
            printf '%s\t%s\n' "$ASSET_NAME" "$(stat -c '%s' "release-assets/$ASSET_NAME")"
          done < "$ASSET_NAMES" > "$EXPECTED_API_ASSETS"
          REMOTE_ASSET_PAGES="$(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100"
          )"
          REMOTE_ASSETS_JSON="$(jq -c '[.[][]]' <<< "$REMOTE_ASSET_PAGES")"
          VERIFIED_REMOTE_INVENTORY="$RUNNER_TEMP/qed2-verified-remote-asset-inventory.json"
          jq -S -c 'sort_by(.name) | map({id, name, size, digest})' \
            <<< "$REMOTE_ASSETS_JSON" > "$VERIFIED_REMOTE_INVENTORY"
          jq -r '.[] | [.name, (.size | tostring)] | @tsv' <<< "$REMOTE_ASSETS_JSON" \
            | LC_ALL=C sort > "$REMOTE_API_ASSETS"
          if ! cmp -s "$EXPECTED_API_ASSETS" "$REMOTE_API_ASSETS"; then
            echo "Draft release asset names or sizes differ from the verified local set." >&2
            diff -u "$EXPECTED_API_ASSETS" "$REMOTE_API_ASSETS" || true
            exit 1
          fi

          # Re-download what GitHub will serve, then compare every byte to the
          # already verified/attested local files. API metadata alone is not a
          # content-integrity check.
          REMOTE_ASSET_ROOT="$(mktemp -d)"
          cleanup_remote_assets() { rm -rf "$REMOTE_ASSET_ROOT"; }
          trap cleanup_remote_assets EXIT
          REMOTE_ASSET_MAP="$RUNNER_TEMP/qed2-remote-release-assets-with-ids.tsv"
          jq -r '.[] | [.id, .name] | @tsv' <<< "$REMOTE_ASSETS_JSON" > "$REMOTE_ASSET_MAP"
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            if [[ ! "$ASSET_ID" =~ ^[0-9]+$ ]]; then
              echo "GitHub returned an invalid uploaded asset ID." >&2
              exit 1
            fi
            gh api --header 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
              > "$REMOTE_ASSET_ROOT/$ASSET_NAME"
          done < "$REMOTE_ASSET_MAP"
          find "$REMOTE_ASSET_ROOT" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort \
            > "$RUNNER_TEMP/qed2-downloaded-release-assets.txt"
          cut -f1 "$EXPECTED_API_ASSETS" > "$RUNNER_TEMP/qed2-expected-release-assets.txt"
          cmp "$RUNNER_TEMP/qed2-expected-release-assets.txt" "$RUNNER_TEMP/qed2-downloaded-release-assets.txt"
          while IFS= read -r ASSET_NAME; do
            LOCAL_SHA256="$(sha256sum "release-assets/$ASSET_NAME" | cut -d ' ' -f1)"
            REMOTE_SHA256="$(sha256sum "$REMOTE_ASSET_ROOT/$ASSET_NAME" | cut -d ' ' -f1)"
            if [[ "$LOCAL_SHA256" != "$REMOTE_SHA256" ]]; then
              echo "Downloaded draft asset differs from verified local file: $ASSET_NAME" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/qed2-expected-release-assets.txt"

          # The tag is checked again immediately before the only operation that
          # makes the draft visible to the updater and end users.
          REMOTE_TAG_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          if [[ "$(jq -r '.object.type' <<< "$REMOTE_TAG_JSON")" != tag || \
                "$(jq -r '.object.sha' <<< "$REMOTE_TAG_JSON")" != "$TAG_OBJECT_SHA" ]]; then
            echo "Annotated release tag object moved before publication." >&2
            exit 1
          fi
          REMOTE_TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$REMOTE_TAG_SHA" != "$CLIENT_SHA" ]]; then
            echo "Release tag moved before publication: expected $CLIENT_SHA, found $REMOTE_TAG_SHA" >&2
            exit 1
          fi
          REMOTE_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$REMOTE_MAIN_SHA" != "$CLIENT_SHA" ]]; then
            echo "origin/main moved before publication: expected $CLIENT_SHA, found $REMOTE_MAIN_SHA" >&2
            exit 1
          fi
          FINAL_ASSET_PAGES="$(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100"
          )"
          FINAL_REMOTE_INVENTORY="$RUNNER_TEMP/qed2-final-remote-asset-inventory.json"
          jq -S -c '[.[][]] | sort_by(.name) | map({id, name, size, digest})' \
            <<< "$FINAL_ASSET_PAGES" > "$FINAL_REMOTE_INVENTORY"
          if ! cmp -s "$VERIFIED_REMOTE_INVENTORY" "$FINAL_REMOTE_INVENTORY"; then
            echo "The verified draft asset identities changed before publication." >&2
            diff -u "$VERIFIED_REMOTE_INVENTORY" "$FINAL_REMOTE_INVENTORY" || true
            exit 1
          fi
          PUBLISHED_RELEASE="$(
            gh api --method PATCH "$RELEASE_API" \
              --raw-field tag_name="$RELEASE_TAG" \
              --raw-field target_commitish="$CLIENT_SHA" \
              --field draft=false \
              --field prerelease=false \
              --raw-field make_latest=true \
              --raw-field name="QED2 $RELEASE_VERSION"
          )"
          if ! jq -e --arg tag "$RELEASE_TAG" --arg target "$CLIENT_SHA" \
            --arg name "QED2 $RELEASE_VERSION" \
            '.tag_name == $tag and .target_commitish == $target and
             .name == $name and .draft == false and
             .prerelease == false and .published_at != null' \
            <<< "$PUBLISHED_RELEASE" >/dev/null; then
            echo "GitHub did not confirm the final public release state." >&2
            exit 1
          fi
          LATEST_CONFIRMED=false
          for LATEST_DELAY in 0 2 5 10 20; do
            if [[ "$LATEST_DELAY" -gt 0 ]]; then sleep "$LATEST_DELAY"; fi
            if LATEST_RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")" && \
               jq -e --argjson id "$RELEASE_ID" --arg tag "$RELEASE_TAG" \
                 '.id == $id and .tag_name == $tag and .draft == false and .prerelease == false' \
                 <<< "$LATEST_RELEASE" >/dev/null; then
              LATEST_CONFIRMED=true
              break
            fi
          done
          if [[ "$LATEST_CONFIRMED" != true ]]; then
            echo "The published release did not become the repository latest release." >&2
            exit 1
          fi
