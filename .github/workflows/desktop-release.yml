name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release (for example v2.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  QED2_CORE_SOURCE: ${{ github.workspace }}/qedv2-core
  QED2_BANK_SOURCE: ${{ github.workspace }}/srdpmppr

jobs:
  release_context:
    name: Resolve immutable release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      client_sha: ${{ steps.release.outputs.client_sha }}
      core_sha: ${{ steps.release.outputs.core_sha }}
      bank_sha: ${{ steps.release.outputs.bank_sha }}
    defaults:
      run:
        working-directory: qedv2-client
    steps:
      - name: Validate private runtime access
        shell: bash
        working-directory: .
        env:
          DESKTOP_RUNTIME_TOKEN: ${{ secrets.DESKTOP_RUNTIME_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DESKTOP_RUNTIME_TOKEN" ]]; then
            echo "Missing DESKTOP_RUNTIME_TOKEN required for the private Core source." >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          path: qedv2-client
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Validate tag and locked release sources
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a stable v-prefixed semantic version: $REQUESTED_TAG" >&2
            exit 1
          fi
          DESKTOP_VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          if [[ "$REQUESTED_TAG" != "v$DESKTOP_VERSION" ]]; then
            echo "Tag/desktop versions disagree: tag=$REQUESTED_TAG desktop=$DESKTOP_VERSION" >&2
            exit 1
          fi
          for PACKAGE_PATH in package.json packages/core-logic/package.json packages/ui/package.json packages/web/package.json; do
            PACKAGE_VERSION="$(node -p "require('./$PACKAGE_PATH').version")"
            if [[ "$PACKAGE_VERSION" != "$DESKTOP_VERSION" ]]; then
              echo "Version mismatch: $PACKAGE_PATH=$PACKAGE_VERSION desktop=$DESKTOP_VERSION" >&2
              exit 1
            fi
          done
          if ! grep -Fq "## $DESKTOP_VERSION —" CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for $DESKTOP_VERSION" >&2
            exit 1
          fi
          CLIENT_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$CLIENT_SHA" != "$MAIN_SHA" ]]; then
            echo "Release tag must resolve to the current origin/main head: tag=$CLIENT_SHA main=$MAIN_SHA" >&2
            exit 1
          fi
          CORE_REPOSITORY="$(node -p "require('./packages/desktop/runtime-sources.json').core.repository")"
          BANK_REPOSITORY="$(node -p "require('./packages/desktop/runtime-sources.json').bank.repository")"
          CORE_SHA="$(node -p "require('./packages/desktop/runtime-sources.json').core.commit")"
          BANK_SHA="$(node -p "require('./packages/desktop/runtime-sources.json').bank.commit")"
          if [[ "$CORE_REPOSITORY" != "tangxiaoyi97/qedv2-core" || "$BANK_REPOSITORY" != "tangxiaoyi97/srdpmppr" ]]; then
            echo "runtime-sources.json contains an unexpected repository" >&2
            exit 1
          fi
          if [[ ! "$CORE_SHA" =~ ^[0-9a-f]{40}$ || ! "$BANK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "runtime-sources.json must pin full Git commit IDs" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$DESKTOP_VERSION" >> "$GITHUB_OUTPUT"
          echo "client_sha=$CLIENT_SHA" >> "$GITHUB_OUTPUT"
          echo "core_sha=$CORE_SHA" >> "$GITHUB_OUTPUT"
          echo "bank_sha=$BANK_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out locked Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/qedv2-core
          ref: ${{ steps.release.outputs.core_sha }}
          path: qedv2-core
          token: ${{ secrets.DESKTOP_RUNTIME_TOKEN }}
          persist-credentials: false

      - name: Check out locked question bank
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/srdpmppr
          ref: ${{ steps.release.outputs.bank_sha }}
          path: srdpmppr
          token: ${{ secrets.DESKTOP_RUNTIME_TOKEN }}
          persist-credentials: false

  release_verify:
    name: Verify frozen release sources
    needs: release_context
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: qedv2-client
    steps:
      - name: Check out frozen client
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_context.outputs.client_sha }}
          path: qedv2-client
          persist-credentials: false

      - name: Check out frozen Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/qedv2-core
          ref: ${{ needs.release_context.outputs.core_sha }}
          path: qedv2-core
          token: ${{ secrets.DESKTOP_RUNTIME_TOKEN }}
          persist-credentials: false

      - name: Check out frozen question bank
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/srdpmppr
          ref: ${{ needs.release_context.outputs.bank_sha }}
          path: srdpmppr
          token: ${{ secrets.DESKTOP_RUNTIME_TOKEN }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            qedv2-client/pnpm-lock.yaml
            qedv2-core/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../qedv2-core install --frozen-lockfile

      - name: Verify complete client and Core release inputs
        run: |
          pnpm typecheck
          pnpm test
          pnpm --filter @qed2/desktop build
          pnpm --dir ../qedv2-core exec jest --runInBand
          pnpm --dir ../qedv2-core test:e2e

      - name: Prepare immutable bundled runtime
        run: |
          pnpm --filter @qed2/desktop runtime:prepare
          pnpm --filter @qed2/desktop runtime:smoke

  macos:
    name: macOS ${{ matrix.arch }} signed and notarized
    needs: [release_context, release_verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment:
      name: desktop-signing
    defaults:
      run:
        working-directory: qedv2-client
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Validate macOS signing and notarization configuration
        shell: bash
        working-directory: .
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$MAC_CSC_LINK" || -z "$MAC_CSC_KEY_PASSWORD" ]]; then
            echo "Missing MAC_CSC_LINK or MAC_CSC_KEY_PASSWORD in desktop-signing." >&2
            exit 1
          fi
          API_READY=false
          ID_READY=false
          if [[ -n "$APPLE_API_KEY_BASE64" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then API_READY=true; fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then ID_READY=true; fi
          if [[ "$API_READY" != true && "$ID_READY" != true ]]; then
            echo "Configure either App Store Connect API-key secrets or the complete Apple ID notarization secret set." >&2
            exit 1
          fi

      - name: Check out frozen client
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_context.outputs.client_sha }}
          path: qedv2-client
          persist-credentials: false

      - name: Check out frozen Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/qedv2-core
          ref: ${{ needs.release_context.outputs.core_sha }}
          path: qedv2-core
          token: ${{ secrets.DESKTOP_RUNTIME_TOKEN }}
          persist-credentials: false

      - name: Check out frozen question bank
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/srdpmppr
          ref: ${{ needs.release_context.outputs.bank_sha }}
          path: srdpmppr
          token: ${{ secrets.DESKTOP_RUNTIME_TOKEN }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            qedv2-client/pnpm-lock.yaml
            qedv2-core/pnpm-lock.yaml

      - name: Cache Electron toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: desktop-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qedv2-client/pnpm-lock.yaml') }}
          restore-keys: |
            desktop-electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../qedv2-core install --frozen-lockfile

      - name: Prepare runtime and build
        run: |
          pnpm --filter @qed2/desktop runtime:prepare
          pnpm --filter @qed2/desktop runtime:smoke
          pnpm --filter @qed2/desktop build

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_API_KEY_BASE64" ]]; then exit 0; fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          pnpm --filter @qed2/desktop exec electron-builder
          --config electron-builder.yml
          --mac --${{ matrix.arch }} --publish never --config.forceCodeSigning=true

      - name: Verify runtime copied into signed macOS package
        run: pnpm --filter @qed2/desktop exec node scripts/smoke-runtime.mjs --packaged

      - name: Verify signature and stapled notarization ticket
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="packages/desktop/dist-packages"
          shopt -s nullglob
          DMGS=("$ARTIFACT_ROOT"/*.dmg)
          ZIPS=("$ARTIFACT_ROOT"/*.zip)
          if [[ "${#DMGS[@]}" -ne 1 || "${#ZIPS[@]}" -ne 1 ]]; then
            echo "Expected exactly one DMG and one ZIP for this architecture." >&2
            exit 1
          fi

          verify_app() {
            local candidate="$1"
            codesign --verify --deep --strict --verbose=2 "$candidate"
            xcrun stapler validate "$candidate"
            spctl --assess --type execute --verbose=4 "$candidate"
          }

          APPS=("$ARTIFACT_ROOT"/mac*/QED2.app)
          if [[ "${#APPS[@]}" -ne 1 ]]; then
            echo "Expected one unpacked QED2.app, found ${#APPS[@]}" >&2
            exit 1
          fi
          verify_app "${APPS[0]}"

          unzip -t "${ZIPS[0]}"
          ZIP_ROOT="$(mktemp -d)"
          DMG_MOUNT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$DMG_MOUNT" -quiet 2>/dev/null || true
            rm -rf "$ZIP_ROOT" "$DMG_MOUNT"
          }
          trap cleanup EXIT

          ditto -x -k "${ZIPS[0]}" "$ZIP_ROOT"
          ZIP_APPS=("$ZIP_ROOT"/QED2.app "$ZIP_ROOT"/*/QED2.app)
          if [[ "${#ZIP_APPS[@]}" -ne 1 ]]; then
            echo "Expected one QED2.app in the ZIP, found ${#ZIP_APPS[@]}" >&2
            exit 1
          fi
          verify_app "${ZIP_APPS[0]}"

          hdiutil verify "${DMGS[0]}"
          hdiutil attach "${DMGS[0]}" -nobrowse -readonly -mountpoint "$DMG_MOUNT"
          DMG_APPS=("$DMG_MOUNT"/QED2.app "$DMG_MOUNT"/*/QED2.app)
          if [[ "${#DMG_APPS[@]}" -ne 1 ]]; then
            echo "Expected one QED2.app in the DMG, found ${#DMG_APPS[@]}" >&2
            exit 1
          fi
          verify_app "${DMG_APPS[0]}"
          hdiutil detach "$DMG_MOUNT"
          trap - EXIT
          cleanup

      - name: Boot-smoke signed and notarized macOS application
        run: >-
          pnpm --filter @qed2/desktop exec node scripts/smoke-packaged-app.mjs
          --diagnostics-dir "${{ runner.temp }}/qed2-packaged-smoke"

      - name: Upload macOS boot-smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos-${{ matrix.arch }}-boot-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/qed2-packaged-smoke

      - name: Upload macOS release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          path: |
            qedv2-client/packages/desktop/dist-packages/*.dmg
            qedv2-client/packages/desktop/dist-packages/*.zip
            qedv2-client/packages/desktop/dist-packages/*.blockmap

  windows:
    name: Windows x64 signed
    needs: [release_context, release_verify]
    runs-on: windows-2022
    timeout-minutes: 75
    environment:
      name: desktop-signing
    defaults:
      run:
        working-directory: qedv2-client
    steps:
      - name: Validate Windows signing configuration
        shell: pwsh
        working-directory: .
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'Missing WIN_CSC_LINK or WIN_CSC_KEY_PASSWORD in desktop-signing.'
          }

      - name: Check out frozen client
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_context.outputs.client_sha }}
          path: qedv2-client
          persist-credentials: false

      - name: Check out frozen Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/qedv2-core
          ref: ${{ needs.release_context.outputs.core_sha }}
          path: qedv2-core
          token: ${{ secrets.DESKTOP_RUNTIME_TOKEN }}
          persist-credentials: false

      - name: Check out frozen question bank
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/srdpmppr
          ref: ${{ needs.release_context.outputs.bank_sha }}
          path: srdpmppr
          token: ${{ secrets.DESKTOP_RUNTIME_TOKEN }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            qedv2-client/pnpm-lock.yaml
            qedv2-core/pnpm-lock.yaml

      - name: Cache Electron toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: desktop-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qedv2-client/pnpm-lock.yaml') }}
          restore-keys: |
            desktop-electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../qedv2-core install --frozen-lockfile

      - name: Prepare runtime and build
        run: |
          pnpm --filter @qed2/desktop runtime:prepare
          pnpm --filter @qed2/desktop runtime:smoke
          pnpm --filter @qed2/desktop build

      - name: Build and sign NSIS installer
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: >-
          pnpm --filter @qed2/desktop exec electron-builder
          --config electron-builder.yml
          --win --x64 --publish never --config.forceCodeSigning=true

      - name: Verify runtime copied into signed Windows package
        run: pnpm --filter @qed2/desktop exec node scripts/smoke-runtime.mjs --packaged

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem packages/desktop/dist-packages -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          if ($signature.Status -ne 'Valid') {
            throw "Invalid Authenticode signature: $($signature.Status) $($signature.StatusMessage)"
          }
          if ($null -eq $signature.SignerCertificate) {
            throw 'The installer has no signer certificate.'
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw 'The installer signature has no trusted timestamp.'
          }

      - name: Boot-smoke signed Windows application
        run: >-
          pnpm --filter @qed2/desktop exec node scripts/smoke-packaged-app.mjs
          --diagnostics-dir "${{ runner.temp }}/qed2-packaged-smoke"

      - name: Upload Windows boot-smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-x64-boot-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/qed2-packaged-smoke

      - name: Upload Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-x64
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          path: |
            qedv2-client/packages/desktop/dist-packages/*.exe
            qedv2-client/packages/desktop/dist-packages/*.blockmap
            qedv2-client/packages/desktop/dist-packages/latest.yml

  linux:
    name: Linux x64 packages
    needs: [release_context, release_verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: qedv2-client
    steps:
      - name: Check out frozen client
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_context.outputs.client_sha }}
          path: qedv2-client
          persist-credentials: false

      - name: Check out frozen Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/qedv2-core
          ref: ${{ needs.release_context.outputs.core_sha }}
          path: qedv2-core
          token: ${{ secrets.DESKTOP_RUNTIME_TOKEN }}
          persist-credentials: false

      - name: Check out frozen question bank
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tangxiaoyi97/srdpmppr
          ref: ${{ needs.release_context.outputs.bank_sha }}
          path: srdpmppr
          token: ${{ secrets.DESKTOP_RUNTIME_TOKEN }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            qedv2-client/pnpm-lock.yaml
            qedv2-core/pnpm-lock.yaml

      - name: Cache Electron toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qedv2-client/pnpm-lock.yaml') }}
          restore-keys: |
            desktop-electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm xvfb

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../qedv2-core install --frozen-lockfile

      - name: Prepare runtime and build
        run: |
          pnpm --filter @qed2/desktop runtime:prepare
          pnpm --filter @qed2/desktop runtime:smoke
          pnpm --filter @qed2/desktop build

      - name: Build AppImage, deb and rpm
        run: >-
          pnpm --filter @qed2/desktop exec electron-builder
          --config electron-builder.yml
          --linux --x64 --publish never

      - name: Verify runtime copied into Linux package tree
        run: pnpm --filter @qed2/desktop exec node scripts/smoke-runtime.mjs --packaged

      - name: Verify Linux package set
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="packages/desktop/dist-packages"
          find "$ARTIFACT_ROOT" -maxdepth 1 -type f -name '*.AppImage' | grep -q .
          find "$ARTIFACT_ROOT" -maxdepth 1 -type f -name '*.deb' | grep -q .
          find "$ARTIFACT_ROOT" -maxdepth 1 -type f -name '*.rpm' | grep -q .
          dpkg-deb --info "$ARTIFACT_ROOT"/*.deb >/dev/null
          rpm --query --package --info "$ARTIFACT_ROOT"/*.rpm >/dev/null

      - name: Boot-smoke Linux application under virtual display
        run: >-
          pnpm --filter @qed2/desktop exec node scripts/smoke-packaged-app.mjs
          --diagnostics-dir "${{ runner.temp }}/qed2-packaged-smoke"

      - name: Upload Linux boot-smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-linux-x64-boot-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/qed2-packaged-smoke

      - name: Upload Linux release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-linux-x64
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          path: |
            qedv2-client/packages/desktop/dist-packages/*.AppImage
            qedv2-client/packages/desktop/dist-packages/*.deb
            qedv2-client/packages/desktop/dist-packages/*.rpm
            qedv2-client/packages/desktop/dist-packages/latest-linux.yml

  publish:
    name: Publish GitHub Release
    needs: [release_context, macos, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: desktop-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_context.outputs.client_sha }}
          persist-credentials: false

      - name: Download verified assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      # Two native macOS jobs each produce a correct per-architecture update
      # manifest. Publish one manifest containing both ZIPs so MacUpdater can
      # select the matching architecture from the artifact name.
      - name: Assemble macOS multi-architecture update metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release_context.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t MAC_ZIPS < <(find release-assets -maxdepth 1 -type f -name 'QED2-*-mac-*.zip' -printf '%f\n' | sort)
          if [[ "${#MAC_ZIPS[@]}" -ne 2 ]]; then
            echo "Expected x64 and arm64 macOS ZIPs, found ${#MAC_ZIPS[@]}" >&2
            exit 1
          fi
          LEGACY_PATH="$(printf '%s\n' "${MAC_ZIPS[@]}" | grep -- '-x64\.zip$')"
          {
            printf 'version: %s\n' "$RELEASE_VERSION"
            printf 'files:\n'
            for ARCHIVE in "${MAC_ZIPS[@]}"; do
              SHA512="$(openssl dgst -sha512 -binary "release-assets/$ARCHIVE" | openssl base64 -A)"
              SIZE="$(stat -c '%s' "release-assets/$ARCHIVE")"
              printf '  - url: %s\n    sha512: %s\n    size: %s\n' "$ARCHIVE" "$SHA512" "$SIZE"
            done
            LEGACY_SHA512="$(openssl dgst -sha512 -binary "release-assets/$LEGACY_PATH" | openssl base64 -A)"
            printf "path: %s\nsha512: %s\nreleaseDate: '%s'\n" \
              "$LEGACY_PATH" "$LEGACY_SHA512" "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          } > release-assets/latest-mac.yml

      - name: Verify complete release set and record provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release_context.outputs.tag }}
          CLIENT_SHA: ${{ needs.release_context.outputs.client_sha }}
          CORE_SHA: ${{ needs.release_context.outputs.core_sha }}
          BANK_SHA: ${{ needs.release_context.outputs.bank_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE_TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$REMOTE_TAG_SHA" != "$CLIENT_SHA" ]]; then
            echo "Release tag moved during the run: expected $CLIENT_SHA, found $REMOTE_TAG_SHA" >&2
            exit 1
          fi
          REMOTE_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$REMOTE_MAIN_SHA" != "$CLIENT_SHA" ]]; then
            echo "origin/main moved during the release: expected $CLIENT_SHA, found $REMOTE_MAIN_SHA" >&2
            exit 1
          fi
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.rpm' | wc -l)" -eq 1
          test -f release-assets/latest.yml
          test -f release-assets/latest-mac.yml
          test -f release-assets/latest-linux.yml
          printf 'QED2 desktop release %s\nclient %s\ncore main %s\nbank pastpapers %s\n' \
            "$RELEASE_TAG" "$CLIENT_SHA" "$CORE_SHA" "$BANK_SHA" \
            > release-assets/runtime-sources.txt

          node packages/desktop/scripts/verify-release-assets.mjs \
            --root release-assets \
            --version "${RELEASE_TAG#v}" \
            --tag "$RELEASE_TAG" \
            --client-sha "$CLIENT_SHA" \
            --core-sha "$CORE_SHA" \
            --bank-sha "$BANK_SHA"

      - name: Attest release build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*

      - name: Stage, verify and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_context.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release_context.outputs.version }}
          CLIENT_SHA: ${{ needs.release_context.outputs.client_sha }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS)
          RELEASE_API="repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          if RELEASE_JSON="$(gh api "$RELEASE_API" 2>/dev/null)"; then
            if [[ "$(jq -r '.draft' <<< "$RELEASE_JSON")" != true ]]; then
              echo "Release $RELEASE_TAG is already published and must not be replaced; publish a higher version." >&2
              exit 1
            fi
          else
            # Never expose a release while assets are still being transferred.
            # A failed upload leaves only a resumable draft.
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes \
              --title "QED2 $RELEASE_VERSION"
            RELEASE_JSON="$(gh api "$RELEASE_API")"
          fi

          RELEASE_ID="$(jq -r '.id' <<< "$RELEASE_JSON")"
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "GitHub returned an invalid draft release ID." >&2
            exit 1
          fi

          # A retry starts from an exact empty asset set. This prevents a stale
          # payload from a prior failed workflow (or manual draft edit) from
          # being made public alongside the locally verified release.
          mapfile -t EXISTING_ASSET_IDS < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[].id'
          )
          for ASSET_ID in "${EXISTING_ASSET_IDS[@]}"; do
            [[ "$ASSET_ID" =~ ^[0-9]+$ ]] || {
              echo "GitHub returned an invalid draft asset ID." >&2
              exit 1
            }
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          done

          gh release upload "$RELEASE_TAG" release-assets/*

          EXPECTED_API_ASSETS="$RUNNER_TEMP/qed2-expected-release-assets.tsv"
          REMOTE_API_ASSETS="$RUNNER_TEMP/qed2-remote-release-assets.tsv"
          while IFS= read -r ASSET_NAME; do
            printf '%s\t%s\n' "$ASSET_NAME" "$(stat -c '%s' "release-assets/$ASSET_NAME")"
          done < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort) \
            > "$EXPECTED_API_ASSETS"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | [.name, (.size | tostring)] | @tsv' | LC_ALL=C sort > "$REMOTE_API_ASSETS"
          if ! cmp -s "$EXPECTED_API_ASSETS" "$REMOTE_API_ASSETS"; then
            echo "Draft release asset names or sizes differ from the verified local set." >&2
            diff -u "$EXPECTED_API_ASSETS" "$REMOTE_API_ASSETS" || true
            exit 1
          fi

          # Re-download what GitHub will serve, then compare every byte to the
          # already verified/attested local files. API metadata alone is not a
          # content-integrity check.
          REMOTE_ASSET_ROOT="$(mktemp -d)"
          cleanup_remote_assets() { rm -rf "$REMOTE_ASSET_ROOT"; }
          trap cleanup_remote_assets EXIT
          gh release download "$RELEASE_TAG" --dir "$REMOTE_ASSET_ROOT"
          find "$REMOTE_ASSET_ROOT" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort \
            > "$RUNNER_TEMP/qed2-downloaded-release-assets.txt"
          cut -f1 "$EXPECTED_API_ASSETS" > "$RUNNER_TEMP/qed2-expected-release-assets.txt"
          cmp "$RUNNER_TEMP/qed2-expected-release-assets.txt" "$RUNNER_TEMP/qed2-downloaded-release-assets.txt"
          while IFS= read -r ASSET_NAME; do
            LOCAL_SHA256="$(sha256sum "release-assets/$ASSET_NAME" | cut -d ' ' -f1)"
            REMOTE_SHA256="$(sha256sum "$REMOTE_ASSET_ROOT/$ASSET_NAME" | cut -d ' ' -f1)"
            if [[ "$LOCAL_SHA256" != "$REMOTE_SHA256" ]]; then
              echo "Downloaded draft asset differs from verified local file: $ASSET_NAME" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/qed2-expected-release-assets.txt"

          # The tag is checked again immediately before the only operation that
          # makes the draft visible to the updater and end users.
          REMOTE_TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$REMOTE_TAG_SHA" != "$CLIENT_SHA" ]]; then
            echo "Release tag moved before publication: expected $CLIENT_SHA, found $REMOTE_TAG_SHA" >&2
            exit 1
          fi
          REMOTE_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$REMOTE_MAIN_SHA" != "$CLIENT_SHA" ]]; then
            echo "origin/main moved before publication: expected $CLIENT_SHA, found $REMOTE_MAIN_SHA" >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest \
            --title "QED2 $RELEASE_VERSION"
